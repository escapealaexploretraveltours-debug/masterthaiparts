<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Thai Parts & Accessories</title>
  <meta name="description" content="Inventory management for Master Thai Parts & Accessories — Supabase + vanilla JS.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <header class="navbar">
    <div class="logo-container">
      <img src="assets/logo.jpg" alt="Master Thai Parts logo" class="logo-img">
      <div>
        <h2 class="logo" id="shopName">Master Thai Parts & Accessories</h2>
        <p class="address" id="shopAddress"></p>
      </div>
    </div>
    <div class="date-time"><span id="datetime"></span></div>
  </header>

  <main class="login-wrap">
    <div class="login-card" id="form">
      <h1>Welcome to Master Thai Parts &amp; Accessories</h1>
      <form id="loginForm" name="form" autocomplete="on" novalidate>
        <label for="user">Username
          <input type="text" id="user" name="user" required autocomplete="username" autocapitalize="none" spellcheck="false">
        </label>
        <label for="pass">Password
          <input type="password" id="pass" name="pass" required autocomplete="current-password">
        </label>
        <p id="errorMessage" class="err" role="alert" hidden></p>
        <input type="submit" id="btn" value="Login" name="submit">
      </form>
      <p class="setup-note" id="setupNote" hidden>Supabase isn't connected yet — add your keys in <code>js/config.js</code>. The demo works without it.</p>
      <div class="divider"><span>or</span></div>
      <button type="button" class="btn-demo" id="demoBtn">Try the live demo</button>
      <p class="fine">Demo mode uses sample data saved in your browser only.</p>
    </div>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
